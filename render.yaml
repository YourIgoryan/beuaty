services:
  - type: web
    name: beauty-salon-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SALON_NAME
        value: Beauty Studio
      - key: SALON_DESCRIPTION
        value: Уход, красота и хорошее настроение
      - key: SALON_ADDRESS
        value: Укажите адрес салона
      - key: SALON_PHONE
        value: Укажите телефон салона
      - key: TIMEZONE
        value: Europe/Moscow
      - key: BOOKING_DAYS_AHEAD
        value: "21"
      - key: OPEN_TIME
        value: "10:00"
      - key: CLOSE_TIME
        value: "20:00"
      - key: SLOT_STEP_MINUTES
        value: "30"
      - key: REMINDER_MINUTES
        value: "120"
